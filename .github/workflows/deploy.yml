name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deployments at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall app

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names (must be lowercase)
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${REPO}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${REPO}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          [ -n "$EC2_HOST" ] || { echo "EC2_HOST secret is missing"; exit 1; }
          [ -n "$EC2_USER" ] || { echo "EC2_USER secret is missing"; exit 1; }
          [ -n "$SSH_KEY" ]  || { echo "EC2_SSH_KEY secret is missing"; exit 1; }

      - name: Copy deploy files to server
        run: |
          scp docker-compose.yml deploy.sh "$EC2_USER@$EC2_HOST:~/app/"
          ssh "$EC2_USER@$EC2_HOST" "chmod +x ~/app/deploy.sh"

      - name: Log in to registry on server
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy (health check + automatic rollback)
        run: ssh "$EC2_USER@$EC2_HOST" "~/app/deploy.sh '$IMAGE'"

      - name: Log out of registry on server
        if: always()
        run: ssh "$EC2_USER@$EC2_HOST" "docker logout ghcr.io" || true
