name: CI/CD

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths-ignore: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deployments at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall app
      - name: Admin API tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests

  admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build admin website
        run: npm run build

  build:
    needs: [test, admin]
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image names (must be lowercase)
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${REPO}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${REPO}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          [ -n "$EC2_HOST" ] || { echo "EC2_HOST secret is missing"; exit 1; }
          [ -n "$EC2_USER" ] || { echo "EC2_USER secret is missing"; exit 1; }
          [ -n "$SSH_KEY" ]  || { echo "EC2_SSH_KEY secret is missing"; exit 1; }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Cannot reach $EC2_HOST on port 22 (check the security group)"; exit 1; }

      - name: Copy deploy files to server
        run: |
          scp docker-compose.yml deploy.sh "$EC2_USER@$EC2_HOST:~/app/"
          ssh "$EC2_USER@$EC2_HOST" "chmod +x ~/app/deploy.sh"

      - name: Log in to registry on server
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy (health check + automatic rollback)
        run: ssh "$EC2_USER@$EC2_HOST" "~/app/deploy.sh '$IMAGE'"

      - name: Smoke test the public site
        run: |
          for path in /health /admin/; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://wristfracture.duckdns.org$path" || true)
              [ "$code" = "200" ] && { echo "$path OK"; break; }
              [ $i = 6 ] && { echo "$path returned $code"; exit 1; }
              sleep 10
            done
          done
          # Admin API must refuse anonymous callers
          code=$(curl -s -o /dev/null -w "%{http_code}" https://wristfracture.duckdns.org/admin/api/overview)
          [ "$code" = "422" ] || [ "$code" = "401" ] || { echo "admin API returned $code without a token"; exit 1; }

      - name: Log out of registry on server
        if: always()
        run: ssh "$EC2_USER@$EC2_HOST" "docker logout ghcr.io" || true