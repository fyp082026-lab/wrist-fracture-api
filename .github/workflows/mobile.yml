name: Mobile app

# Checks the app on every change and builds an installable Android APK.
# The APK is attached to each run (Actions > run > Artifacts). Builds from
# main are also published as the "mobile-latest" GitHub release.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npx jest --ci
      - name: Check the server is reachable
        run: curl -fsS --max-time 20 https://wristfracture.duckdns.org/health

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          set +e
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Put the cause on the run summary page, so it is readable without opening the log.
            enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
            what=$(grep -A 25 -m 1 "What went wrong" build.log | enc)
            [ -n "$what" ] && echo "::error title=Gradle: what went wrong::$what"
            errs=$(grep -E "^e: |error:|ERROR:|Could not |FAILED" build.log | head -n 20 | enc)
            [ -n "$errs" ] && echo "::error title=Gradle: first errors::$errs"
          fi
          exit $status

      - name: Name the APK
        id: apk
        run: |
          name="PediaFracture.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PediaFracture-android-${{ github.sha }}
          path: mobile/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish as the latest release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: PediaFracture mobile (latest)
          prerelease: true
          make_latest: false
          body: |
            Android build from ${{ github.sha }}.
            Install: download the APK on your phone and open it (allow "Install unknown apps" once).
          files: mobile/${{ steps.apk.outputs.name }}
